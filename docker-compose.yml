services:
  api:
    build: .
    environment:
      DATABASE_URL: postgres://waracle:waracle@postgres:5432/waracle?sslmode=disable
      HTTP_ADDR: :8080
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: waracle
      POSTGRES_USER: waracle
      POSTGRES_PASSWORD: waracle
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waracle -d waracle"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
